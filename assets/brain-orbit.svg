<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img" aria-label="Rotating monochrome brain">
  <defs>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8" result="blur"/>
      <feOffset dy="10" result="offset"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.12"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .turn { transform-box: fill-box; transform-origin: center; animation: turn 12s ease-in-out infinite; }
      .depth { animation: depth 12s ease-in-out infinite; }
      .nodeA { animation: pulse 4s ease-in-out infinite; }
      .nodeB { animation: pulse 4s ease-in-out infinite 1.2s; }
      .nodeC { animation: pulse 4s ease-in-out infinite 2.4s; }
      @keyframes turn {
        0%,100% { transform: scaleX(1) translateX(0); }
        24% { transform: scaleX(.58) translateX(8px); }
        50% { transform: scaleX(-1) translateX(0); }
        76% { transform: scaleX(-.58) translateX(-8px); }
      }
      @keyframes depth { 0%,50%,100% { opacity:.18; } 24%,76% { opacity:.58; } }
      @keyframes pulse { 0%,100% { opacity:.2; } 50% { opacity:1; } }
      @media (prefers-reduced-motion: reduce) { .turn,.depth,.nodeA,.nodeB,.nodeC { animation:none; } }
    </style>
  </defs>

  <rect width="720" height="360" fill="#ffffff"/>

  <g transform="translate(360 172)" filter="url(#shadow)">
    <g class="turn" fill="none" stroke="#111111" stroke-linecap="round" stroke-linejoin="round">
      <path stroke-width="2.6" d="M-8-118C-52-132-102-107-108-63C-141-52-151-14-129 14C-147 49-121 87-82 88C-67 116-31 130 0 105"/>
      <path stroke-width="2.6" d="M8-118C52-132 102-107 108-63C141-52 151-14 129 14C147 49 121 87 82 88C67 116 31 130 0 105"/>
      <path stroke-width="2.1" d="M0-114C-8-89 8-66 0-43C-9-19 8 4 0 28C-8 52 7 76 0 104"/>

      <g stroke-width="1.7" opacity=".92">
        <path d="M-84-84C-54-82-33-64-30-39C-60-34-78-17-79 10"/>
        <path d="M84-84C54-82 33-64 30-39C60-34 78-17 79 10"/>
        <path d="M-101-46C-74-43-56-29-49-8C-76 0-91 17-89 40"/>
        <path d="M101-46C74-43 56-29 49-8C76 0 91 17 89 40"/>
        <path d="M-78 55C-53 42-30 46-12 68"/>
        <path d="M78 55C53 42 30 46 12 68"/>
        <path d="M-59-101C-39-88-23-74-18-55"/>
        <path d="M59-101C39-88 23-74 18-55"/>
        <path d="M-43 94C-28 77-14 75-1 87"/>
        <path d="M43 94C28 77 14 75 1 87"/>
      </g>

      <g class="depth" stroke-width="1.1">
        <path d="M-118-23C-83-2-59 21-53 59"/>
        <path d="M118-23C83-2 59 21 53 59"/>
        <path d="M-89-66C-56-54-36-28-34 3"/>
        <path d="M89-66C56-54 36-28 34 3"/>
        <path d="M-62 8C-42 19-29 38-27 61"/>
        <path d="M62 8C42 19 29 38 27 61"/>
      </g>

      <g stroke-width="1" opacity=".38">
        <path d="M-108-63C-71-53-37-51 0-43C37-51 71-53 108-63"/>
        <path d="M-129 14C-89 17-48 19 0 28C48 19 89 17 129 14"/>
        <path d="M-82 88C-51 78-24 78 0 82C24 78 51 78 82 88"/>
      </g>

      <g fill="#111111" stroke="none">
        <circle class="nodeA" cx="-72" cy="-58" r="3.2"/>
        <circle class="nodeB" cx="55" cy="-75" r="3"/>
        <circle class="nodeC" cx="87" cy="2" r="2.8"/>
        <circle class="nodeB" cx="-86" cy="25" r="2.8"/>
        <circle class="nodeC" cx="41" cy="55" r="3"/>
        <circle class="nodeA" cx="-30" cy="71" r="2.7"/>
      </g>
    </g>
  </g>

  <ellipse cx="360" cy="319" rx="86" ry="11" fill="#000000" opacity=".06"/>
</svg>